<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <h1>Админ-панель</h1>
      <button class="btn-logout" onclick="logout()">Выйти</button>
    </header>

    <main class="admin-content">
      <!-- Профиль -->
      <section class="admin-section">
        <h2>Профиль</h2>
        <div class="form-group">
          <label>Имя</label>
          <input type="text" id="profile-name" class="form-input">
        </div>
        <div class="form-group">
          <label>Тег</label>
          <input type="text" id="profile-tag" class="form-input">
        </div>
        <div class="form-group">
          <label>URL аватара</label>
          <input type="text" id="profile-avatar" class="form-input">
        </div>
        <div class="form-group">
          <label>Описание (Hero)</label>
          <textarea id="profile-description" class="form-textarea" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Обо мне</label>
          <textarea id="profile-about" class="form-textarea" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Telegram ссылка</label>
          <input type="text" id="profile-telegram" class="form-input">
        </div>
        <div class="form-group">
          <label>Навыки</label>
          <input type="text" id="profile-skills" class="form-input" placeholder="Навык 1 · Навык 2 · Навык 3">
        </div>
        <button class="btn-save" onclick="saveProfile()">Сохранить профиль</button>
      </section>

      <!-- Кейсы -->
      <section class="admin-section">
        <h2>Кейсы</h2>
        <div id="cases-list"></div>
      </section>

      <!-- Достижения -->
      <section class="admin-section">
        <h2>Достижения</h2>
        <div class="form-group">
          <label>Конкурсы</label>
          <div id="competitions-list"></div>
        </div>
        <div class="form-group">
          <label>Опыт</label>
          <div id="experience-list"></div>
        </div>
        <button class="btn-save" onclick="saveAchievements()">Сохранить достижения</button>
      </section>

      <!-- Пароль -->
      <section class="admin-section">
        <h2>Безопасность</h2>
        <div class="form-group">
          <label>Новый пароль</label>
          <input type="password" id="new-password" class="form-input" placeholder="Оставьте пустым, чтобы не менять">
        </div>
        <button class="btn-save" onclick="changePassword()">Изменить пароль</button>
      </section>

      <!-- Экспорт данных -->
      <section class="admin-section">
        <h2>Резервная копия</h2>
        <p style="opacity: 0.7; margin-bottom: 16px; font-size: 14px;">
          Данные автоматически сохраняются в браузере. Вы можете скачать резервную копию для сохранения на сервере или другого устройства.
        </p>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <button class="btn-save" onclick="downloadDataJson()" style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
            📥 Скачать data.json
          </button>
          <button class="btn-save" onclick="reloadFromFile()" style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
            🔄 Загрузить из data.json
          </button>
        </div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
