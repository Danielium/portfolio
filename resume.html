<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Резюме — Данила Лапшин</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="resume.css">
</head>

<body>
    <div class="resume-page">
        <header>
            <div class="header-left">
                <img id="avatar" class="resume-avatar" src="" alt="Фото">
                <div class="header-text">
                    <h1 id="name">Имя Фамилия</h1>
                    <h2 id="role">Должность</h2>
                </div>
            </div>
            <div class="header-right" id="contacts">
                <!-- Контакты будут здесь -->
            </div>
        </header>

        <section>
            <h3 class="section-title">Обо мне</h3>
            <div class="section-content">
                <p id="profile-summary">Текст о себе...</p>
            </div>
        </section>

        <section>
            <h3 class="section-title">Навыки</h3>
            <div class="section-content" id="skills-list">
                <!-- Навыки -->
            </div>
        </section>

        <section>
            <h3 class="section-title">Опыт работы</h3>
            <div class="section-content" id="experience-list">
                <!-- Опыт -->
            </div>
        </section>

        <section>
            <h3 class="section-title">Проекты</h3>
            <div class="section-content" id="projects-list">
                <!-- Проекты -->
            </div>
        </section>

        <section>
            <h3 class="section-title">Образование</h3>
            <div class="section-content" id="education-list">
                <!-- Образование -->
            </div>
        </section>

        <section>
            <h3 class="section-title">Достижения</h3>
            <div class="section-content" id="achievements-list">
                <!-- Достижения -->
            </div>
        </section>
    </div>

    <script src="data.js"></script>
    <script src="resume.js"></script>
</body>

</html>
